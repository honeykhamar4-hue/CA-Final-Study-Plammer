  <style>
/* ============================================================
   PADHLE! — ULTRA VIBRANT DESIGN SYSTEM
   Neon Gradient • Glassmorphism • Motion-Heavy • PWA-Ready
   ============================================================ */

:root {
  --bg: #f0f2f7;
  --bg-mesh: radial-gradient(ellipse at 20% 0%, rgba(168,85,247,0.08) 0%, transparent 50%),
             radial-gradient(ellipse at 80% 100%, rgba(236,72,153,0.06) 0%, transparent 50%),
             radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.04) 0%, transparent 60%);
  --card: rgba(255,255,255,0.85);
  --card-alt: rgba(248,250,252,0.9);
  --card-glass: rgba(255,255,255,0.6);
  --bd: rgba(148,163,184,0.25);
  --bd-focus: #a855f7;
  --tx: #0f172a;
  --tx-sec: #334155;
  --mut: #64748b;
  --pri: #a855f7;
  --pri2: #ec4899;
  --pri3: #3b82f6;
  --pri4: #06b6d4;
  --pri-hover: #9333ea;
  --pri-soft: rgba(168,85,247,0.1);
  --pri-border: rgba(168,85,247,0.3);
  --side: rgba(255,255,255,0.75);
  --side-hover: rgba(168,85,247,0.08);
  --topbar: rgba(255,255,255,0.7);
  --ok: #10b981;
  --ok-soft: rgba(16,185,129,0.12);
  --warn: #f59e0b;
  --warn-soft: rgba(245,158,11,0.12);
  --bad: #ef4444;
  --bad-soft: rgba(239,68,68,0.1);
  --purple: #8b5cf6;
  --neon-glow: 0 0 20px rgba(168,85,247,0.3), 0 0 40px rgba(168,85,247,0.1);
  --hd: linear-gradient(135deg, #7c3aed 0%, #a855f7 25%, #ec4899 50%, #f43f5e 75%, #f97316 100%);
  --hd2: linear-gradient(135deg, #06b6d4 0%, #3b82f6 33%, #8b5cf6 66%, #ec4899 100%);
  --hd3: linear-gradient(135deg, #f97316 0%, #ef4444 33%, #ec4899 66%, #a855f7 100%);
  --radius: 16px;
  --radius-sm: 10px;
  --blur: blur(16px);
  --shadow-sm: 0 2px 8px rgba(168,85,247,0.06), 0 1px 3px rgba(0,0,0,0.04);
  --shadow: 0 8px 25px rgba(168,85,247,0.08), 0 3px 10px rgba(0,0,0,0.04);
  --shadow-lg: 0 20px 50px rgba(168,85,247,0.12), 0 8px 20px rgba(0,0,0,0.06);
  --shadow-neon: 0 4px 30px rgba(168,85,247,0.15);
}

:root[data-theme="dark"] {
  --bg: #09090f;
  --bg-mesh: radial-gradient(ellipse at 20% 0%, rgba(168,85,247,0.15) 0%, transparent 50%),
             radial-gradient(ellipse at 80% 100%, rgba(236,72,153,0.1) 0%, transparent 50%),
             radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.08) 0%, transparent 60%);
  --card: rgba(20,20,35,0.8);
  --card-alt: rgba(25,25,45,0.85);
  --card-glass: rgba(20,20,40,0.65);
  --bd: rgba(100,116,139,0.2);
  --bd-focus: #c084fc;
  --tx: #f1f5f9;
  --tx-sec: #cbd5e1;
  --mut: #94a3b8;
  --pri: #c084fc;
  --pri2: #f472b6;
  --pri3: #60a5fa;
  --pri4: #22d3ee;
  --pri-hover: #a855f7;
  --pri-soft: rgba(168,85,247,0.15);
  --pri-border: rgba(168,85,247,0.35);
  --side: rgba(15,15,30,0.85);
  --side-hover: rgba(168,85,247,0.12);
  --topbar: rgba(15,15,30,0.75);
  --ok: #34d399;
  --ok-soft: rgba(52,211,153,0.15);
  --warn: #fbbf24;
  --warn-soft: rgba(251,191,36,0.12);
  --bad: #f87171;
  --bad-soft: rgba(248,113,113,0.12);
  --purple: #a78bfa;
  --neon-glow: 0 0 25px rgba(192,132,252,0.35), 0 0 50px rgba(192,132,252,0.15);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow: 0 8px 25px rgba(0,0,0,0.3);
  --shadow-lg: 0 20px 50px rgba(0,0,0,0.4);
  --shadow-neon: 0 4px 30px rgba(192,132,252,0.2);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--tx); line-height: 1.55; font-size: 14px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; background: var(--bg-mesh); z-index: -1; pointer-events: none; }

/* ============ KEYFRAME ANIMATIONS ============ */
@keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
@keyframes floatSlow { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-8px) rotate(2deg)} }
@keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:0.7; transform:scale(1.05)} }
@keyframes pulseGlow { 0%,100%{box-shadow: 0 0 5px var(--pri), 0 0 15px rgba(168,85,247,0.2)} 50%{box-shadow: 0 0 15px var(--pri), 0 0 40px rgba(168,85,247,0.3)} }
@keyframes slideUp { from{opacity:0; transform:translateY(30px)} to{opacity:1; transform:translateY(0)} }
@keyframes slideDown { from{opacity:0; transform:translateY(-20px)} to{opacity:1; transform:translateY(0)} }
@keyframes slideInLeft { from{opacity:0; transform:translateX(-30px)} to{opacity:1; transform:translateX(0)} }
@keyframes slideInRight { from{opacity:0; transform:translateX(30px)} to{opacity:1; transform:translateX(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes scaleIn { from{opacity:0; transform:scale(0.9)} to{opacity:1; transform:scale(1)} }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
@keyframes borderGlow {
  0%,100%{border-color: rgba(168,85,247,0.3)}
  25%{border-color: rgba(236,72,153,0.4)}
  50%{border-color: rgba(59,130,246,0.4)}
  75%{border-color: rgba(6,182,212,0.3)}
}
@keyframes textGradient {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes particleFloat {
  0%{transform:translate(0,0) scale(1); opacity:0.6}
  25%{transform:translate(30px,-50px) scale(1.2); opacity:0.8}
  50%{transform:translate(-20px,-100px) scale(0.8); opacity:0.4}
  75%{transform:translate(40px,-150px) scale(1.1); opacity:0.6}
  100%{transform:translate(0,-200px) scale(0.5); opacity:0}
}
@keyframes bounceIn {
  0%{opacity:0; transform:scale(0.3)} 50%{opacity:1; transform:scale(1.05)} 70%{transform:scale(0.95)} 100%{transform:scale(1)}
}
@keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-3deg)} 75%{transform:rotate(3deg)} }
@keyframes rainbowBorder {
  0%{border-image-source:linear-gradient(0deg,#a855f7,#ec4899,#f97316)}
  33%{border-image-source:linear-gradient(120deg,#3b82f6,#06b6d4,#10b981)}
  66%{border-image-source:linear-gradient(240deg,#f59e0b,#ef4444,#ec4899)}
  100%{border-image-source:linear-gradient(360deg,#a855f7,#ec4899,#f97316)}
}

/* ============ LAYOUT ============ */
.app-root { display: flex; min-height: 100vh; width: 100%; }

aside {
  width: 250px;
  background: var(--side);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-right: 1px solid var(--bd);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  flex-shrink: 0;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 30;
}
body.sidebar-col aside { width: 68px; }
body.sidebar-col .hide-col { display: none !important; }
body.sidebar-col .logo-tagline { display: none; }
body.sidebar-col .nav-btn { justify-content: center; padding: 10px; }
body.sidebar-col .nav-btn .icon { margin-right: 0; font-size: 20px; }

.brand-box { padding: 20px 16px; border-bottom: 1px solid var(--bd); display: flex; align-items: center; justify-content: space-between; }
.brand-title {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  background: var(--hd);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: textGradient 4s ease infinite;
}
.logo-tagline { font-size: 10.5px; color: var(--mut); margin-top: 3px; font-weight: 500; font-style: italic; }
.toggle-side-btn { background: none; border: 1px solid var(--bd); border-radius: 8px; color: var(--mut); cursor: pointer; padding: 5px 8px; font-size: 13px; transition: all 0.2s; }
.toggle-side-btn:hover { background: var(--pri-soft); color: var(--pri); border-color: var(--pri-border); transform: scale(1.08); }

.nav-links { padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav-btn {
  display: flex;
  align-items: center;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: none;
  color: var(--tx-sec);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  text-align: left;
  width: 100%;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
.nav-btn .icon { font-size: 17px; margin-right: 12px; flex-shrink: 0; transition: transform 0.2s; }
.nav-btn:hover { background: var(--side-hover); color: var(--tx); transform: translateX(4px); border-color: var(--bd); }
.nav-btn:hover .icon { transform: scale(1.15); }
.nav-btn.active {
  background: var(--hd);
  background-size: 200% 200%;
  animation: gradientShift 5s ease infinite;
  color: #fff;
  font-weight: 700;
  box-shadow: var(--shadow-neon);
  border-color: transparent;
}
.nav-btn.active .icon { color: #fff; }

.sidebar-footer { padding: 14px; border-top: 1px solid var(--bd); font-size: 12px; color: var(--mut); }

.content-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; overflow-y: auto; scroll-behavior: smooth; }

/* ============ TOPBAR ============ */
header.topbar {
  height: 68px;
  background: var(--topbar);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--bd);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 25;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.page-title { font-size: 18px; font-weight: 800; color: var(--tx); letter-spacing: -0.3px; }

.utility-bar { display: flex; align-items: center; gap: 8px; }
.pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card-glass);
  backdrop-filter: blur(8px);
  border: 1px solid var(--bd);
  color: var(--tx);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  user-select: none;
}
.pill-btn:hover { border-color: var(--pri); background: var(--pri-soft); color: var(--pri); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.user-pill {
  background: var(--pri-soft);
  border: 1px solid var(--pri-border);
  color: var(--pri);
  padding: 4px 14px 4px 6px;
  border-radius: 99px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 600;
  transition: all 0.25s;
}
.user-pill:hover { box-shadow: var(--neon-glow); transform: translateY(-1px); }
.user-avatar {
  width: 28px;
  height: 28px;
  background: var(--hd);
  background-size: 200% 200%;
  animation: gradientShift 4s ease infinite;
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
}
.logout-btn {
  background: var(--card-glass);
  backdrop-filter: blur(8px);
  border: 1px solid var(--bd);
  color: var(--bad);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.25s;
}
.logout-btn:hover { background: var(--bad-soft); border-color: var(--bad); transform: translateY(-1px); }

main { padding: 24px; max-width: 1240px; width: 100%; margin: 0 auto; min-width: 0; }

/* ============ TYPOGRAPHY ============ */
h1, h2, h3, h4 { margin: 0 0 10px; color: var(--tx); font-weight: 800; }
h2 { font-size: 24px; letter-spacing: -0.4px; }
h3 { font-size: 16px; letter-spacing: -0.2px; }
p { margin: 0 0 12px; color: var(--tx-sec); }
.mut { color: var(--mut); }
.sp { flex: 1; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.gradient-text {
  background: var(--hd);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: textGradient 4s ease infinite;
}

/* ============ CARDS — GLASSMORPHISM ============ */
.card {
  background: var(--card);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--bd);
  border-radius: var(--radius);
  padding: 20px 22px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  animation: slideUp 0.5s ease both;
}
.card:hover { box-shadow: var(--shadow); border-color: var(--pri-border); transform: translateY(-2px); }
.card-glow { animation: borderGlow 6s ease infinite, slideUp 0.5s ease both; }
.g { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 16px; }
.g .card { animation-delay: calc(var(--i, 0) * 0.08s); }
.g2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); margin-bottom: 16px; }

/* ============ HERO BANNER — MEGA GRADIENT ============ */
.hero {
  background: var(--hd);
  background-size: 300% 300%;
  animation: gradientShift 8s ease infinite;
  color: #ffffff;
  padding: 28px 30px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg), var(--neon-glow);
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  opacity: 0.6;
  pointer-events: none;
}
.hero-title { font-size: 26px; font-weight: 900; margin: 0 0 4px; letter-spacing: -0.4px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); position: relative; }
.hero-subtitle { font-size: 14px; opacity: 0.92; margin: 0; position: relative; }
.hero-countdown-box {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: var(--radius);
  padding: 12px 22px;
  text-align: right;
  position: relative;
  animation: float 4s ease-in-out infinite;
}
.countdown-val { font-size: 36px; font-weight: 900; line-height: 1.1; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.countdown-lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.85; }

/* ============ FLOATING PARTICLES (Auth & Dashboard) ============ */
.particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.particle {
  position: absolute;
  border-radius: 50%;
  animation: particleFloat linear infinite;
  pointer-events: none;
}

/* ============ QUOTE BOX ============ */
.quote-box {
  background: var(--card-glass);
  backdrop-filter: var(--blur);
  border: 1px solid var(--bd);
  border-left: 4px solid;
  border-image: var(--hd) 1;
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 16px 20px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  animation: slideInLeft 0.6s ease both;
}
.quote-text { font-style: italic; font-size: 14px; color: var(--tx); font-weight: 500; }
.quote-btn { background: var(--pri-soft); border: 1px solid var(--pri-border); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--pri); font-weight: 600; transition: all 0.2s; }
.quote-btn:hover { background: var(--pri); color: #fff; transform: rotate(180deg) scale(1.05); }

/* ============ BUTTONS & INPUTS ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--bd);
  background: var(--card-glass);
  backdrop-filter: blur(8px);
  color: var(--tx);
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
  font-family: inherit;
  position: relative;
  overflow: hidden;
}
.btn:hover { border-color: var(--pri); color: var(--pri); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(0) scale(0.98); }
.btn.pri {
  background: var(--hd);
  background-size: 200% 200%;
  animation: gradientShift 5s ease infinite;
  color: #ffffff;
  border: none;
  box-shadow: var(--shadow-neon);
}
.btn.pri:hover { box-shadow: var(--neon-glow); transform: translateY(-2px); }
.btn.d { color: var(--bad); border-color: rgba(239,68,68,0.3); }
.btn.d:hover { background: var(--bad-soft); border-color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }

input, select, textarea {
  background: var(--card);
  color: var(--tx);
  border: 1px solid var(--bd);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-size: 13px;
  font-family: inherit;
  transition: all 0.25s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--pri);
  box-shadow: 0 0 0 3px var(--pri-soft), var(--shadow-neon);
}
textarea { width: 100%; min-height: 60px; resize: vertical; }

/* ============ BADGES & TAGS ============ */
.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.3px;
}
.badge { display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; }
.badge-a { background: linear-gradient(135deg,#fee2e2,#fecaca); color: #b91c1c; border: 1px solid #fca5a5; }
.badge-b { background: linear-gradient(135deg,#fef3c7,#fde68a); color: #b45309; border: 1px solid #fcd34d; }
.badge-c { background: linear-gradient(135deg,#dcfce7,#bbf7d0); color: #15803d; border: 1px solid #86efac; }
.badge-u { background: var(--bd); color: var(--mut); }

/* ============ PROGRESS BARS — ANIMATED ============ */
.bar { height: 8px; background: var(--bd); border-radius: 99px; overflow: hidden; margin: 6px 0; position: relative; }
.bar i {
  display: block;
  height: 100%;
  border-radius: 99px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
.bar i::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  background-size: 200% 100%;

// Generate floating particles HTML
function particlesHTML(count=15){
  const colors=['#a855f7','#ec4899','#3b82f6','#06b6d4','#f97316','#10b981','#f43f5e'];
  let html='<div class="particles">';
  for(let i=0;i<count;i++){
    const c=colors[i%colors.length];
    const size=4+Math.random()*8;
    const left=Math.random()*100;
    const top=60+Math.random()*40;
    const dur=6+Math.random()*10;
    const delay=Math.random()*8;
    html+=`<div class="particle" style="width:${size}px;height:${size}px;background:${c};left:${left}%;top:${top}%;animation-duration:${dur}s;animation-delay:${delay}s;opacity:0.5;"></div>`;
  }
  return html+'</div>';
}

views.plan=()=>{
  const t=today();const d=P_date;const activeSubs=getActiveSubjects();
  const dayTasks=S.tasks.filter(x=>x.date===d).sort((a,b)=>(a.startTime||'99')>(b.startTime||'99')?1:-1);
  const doneCount=dayTasks.filter(x=>x.done).length;
  const prIcons={H:'🔴 High',M:'🟡 Med',L:'🟢 Low'};
  const cascadingChapters=CH.filter(c=>c.sub===(activeSubs[0]||'FR'));

  const taskRow=task=>`<div class="row" style="background:var(--card-alt);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:8px;animation:slideUp 0.3s ease both;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--pri-border)';this.style.transform='translateX(4px)'" onmouseout="this.style.borderColor='var(--bd)';this.style.transform='translateX(0)'"><input type="checkbox" ${task.done?'checked':''} onchange="toggleTaskDone(${task.id})" style="accent-color:var(--pri);width:18px;height:18px;"><div style="flex:1;min-width:200px;"><span style="${task.done?'text-decoration:line-through;color:var(--mut);':'font-weight:700;'}">${tagS(task.sub)} ${esc(task.t)}</span>${task.chId?`<small class="mut"> · ${esc(chOf(task.chId)?.name||'')}</small>`:''}</div><div><span style="font-size:11.5px;margin-right:8px;">${prIcons[task.pri]||''}</span>${task.startTime?`<span class="badge badge-u">${fmtTime(task.startTime)}-${fmtTime(task.endTime)}</span>`:''}</div><button class="btn d sm" onclick="cfm('Delete this task?',()=>deleteTask(${task.id}))">✕</button></div>`;

  let calendarBody;
  if(P_mode==='day'){
    calendarBody=`<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;align-items:center;"><h3 style="margin:0;" class="gradient-text">Tasks for ${d} ${d===t?'(Today)':''}</h3><b>${doneCount}/${dayTasks.length} (${pc(doneCount,dayTasks.length)}%)</b></div>${bar(pc(doneCount,dayTasks.length),'var(--ok)')}</div>${dayTasks.length?dayTasks.map(taskRow).join(''):'<div style="text-align:center;padding:40px;" class="mut">No tasks scheduled. Add one above! 📝</div>'}`;
  }else if(P_mode==='week'){
    const st=new Date(d+'T00:00');st.setDate(st.getDate()-st.getDay());const s0=ld(st);
    calendarBody=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;">${[...Array(7)].map((_,i)=>{const x=addD(s0,i);const l=S.tasks.filter(y=>y.date===x);const dn=l.filter(y=>y.done).length;return`<div style="min-height:90px;border:1px solid var(--bd);border-radius:10px;padding:8px;cursor:pointer;background:${x===t?'var(--pri-soft)':'var(--card)'};border-color:${x===d?'var(--pri)':'var(--bd)'};transition:all 0.2s;" onclick="P_date='${x}';P_mode='day';renderApp();" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'"><div style="display:flex;justify-content:space-between;"><b>${x.slice(5)}</b><small class="mut">${dn}/${l.length}</small></div><div style="margin-top:4px;">${l.slice(0,3).map(y=>`<div style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${y.done?'text-decoration:line-through;color:var(--mut);':''}">• ${esc(y.t)}</div>`).join('')}${l.length>3?`<small class="mut">+${l.length-3}</small>`:''}</div></div>`;}).join('')}</div>`;
  }else{
    const f=new Date(d.slice(0,8)+'01T00:00');const dim=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
    calendarBody=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;">${'Sun,Mon,Tue,Wed,Thu,Fri,Sat'.split(',').map(dn=>`<div style="text-align:center;font-weight:700;font-size:12px;color:var(--mut);">${dn}</div>`).join('')}${'<div></div>'.repeat(f.getDay())}${[...Array(dim)].map((_,i)=>{const x=d.slice(0,8)+String(i+1).padStart(2,'0');const l=S.tasks.filter(y=>y.date===x);const dn=l.filter(y=>y.done).length;return`<div style="min-height:60px;border:1px solid var(--bd);border-radius:10px;padding:6px;cursor:pointer;background:${x===t?'var(--pri-soft)':'var(--card)'};border-color:${x===d?'var(--pri)':'var(--bd)'};transition:all 0.2s;" onclick="P_date='${x}';P_mode='day';renderApp();"><div style="display:flex;justify-content:space-between;"><b>${i+1}</b>${l.length?`<small class="mut">${dn}/${l.length}</small>`:''}</div></div>`;}).join('')}</div>`;
  }

  return`
    <h2 class="gradient-text">Study Planner & Task Manager</h2>
    <div class="card card-glow"><h3 style="margin-bottom:12px;">Schedule a New Study Task</h3><div class="form-group" style="margin-bottom:10px;"><label style="font-size:12px;font-weight:700;color:var(--tx-sec);">Particulars</label><input id="t_title" placeholder="e.g. Solve Ind AS 115 Case Studies" style="width:100%;"></div><div class="row"><div style="flex:1;min-width:140px;"><label style="font-size:12px;font-weight:700;" class="mut">Subject</label><select id="t_sub" style="width:100%;margin-top:2px;" onchange="updatePlannerChapterDropdown()">${activeSubs.map(k=>`<option value="${k}">${k} (${SUBS[k]})</option>`).join('')}</select></div><div style="flex:1;min-width:180px;"><label style="font-size:12px;font-weight:700;" class="mut">Chapter</label><select id="t_ch" style="width:100%;margin-top:2px;"><option value="">Link Chapter (Optional)</option>${cascadingChapters.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div style="width:110px;"><label style="font-size:12px;font-weight:700;" class="mut">Priority</label><select id="t_pri" style="width:100%;margin-top:2px;"><option value="H">🔴 High</option><option value="M" selected>🟡 Medium</option><option value="L">🟢 Low</option></select></div><div style="width:130px;"><label style="font-size:12px;font-weight:700;" class="mut">Date</label><input type="date" id="t_date" value="${d}" style="width:100%;margin-top:2px;"></div></div><div class="row" style="margin-top:6px;"><div style="display:flex;align-items:center;gap:8px;"><label style="font-size:12px;font-weight:700;" class="mut">Time Block:</label><input type="time" id="t_start"><span>to</span><input type="time" id="t_end"><small class="mut">(${S.timeFormat.toUpperCase()})</small></div><span class="sp"></span><button class="btn pri" onclick="addNewPlannerTask()">⚡ Add Task</button></div></div>

function updatePlannerChapterDropdown(){const s=$('#t_sub');const c=$('#t_ch');if(!s||!c)return;c.innerHTML='<option value="">Link Chapter (Optional)</option>'+CH.filter(x=>x.sub===s.value).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');}
function addNewPlannerTask(){const title=$('#t_title').value.trim();const sub=$('#t_sub').value;const chId=$('#t_ch').value;const pri=$('#t_pri').value;const date=$('#t_date').value;const startTime=$('#t_start').value;const endTime=$('#t_end').value;if(!title)return toast('Enter a task title');if(!date)return toast('Select a date');S.tasks.push({id:Date.now(),t:title,sub,chId:chId||null,pri,date,startTime:startTime||null,endTime:endTime||null,done:0,on:null});saveActiveUserData();P_date=date;renderApp();toast('Task added! 🚀');}
function toggleTaskDone(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.done=t.done?0:1;t.on=t.done?today():null;saveActiveUserData();renderApp();}
function deleteTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);saveActiveUserData();renderApp();toast('Task deleted');}
function shiftPlannerDate(n){const x=new Date(P_date+'T00:00');if(P_mode==='month')x.setMonth(x.getMonth()+n);else x.setDate(x.getDate()+n*(P_mode==='week'?7:1));P_date=ld(x);renderApp();}

// === TIMER ===
let audioCtx=null;
function playChime(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();[0,0.25,0.5].forEach((offset,idx)=>{const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);osc.frequency.value=[523.25,659.25,783.99][idx];gain.gain.value=0.2;osc.start(audioCtx.currentTime+offset);osc.stop(audioCtx.currentTime+offset+0.25);});}catch(e){}}

function timerTick(){if(!S||!S.tm)return;const t=S.tm;if(t.run){t.left=Math.max(0,Math.round((t.end-Date.now())/1000));if(t.left<=0)handleTimerFinish(true);}const disp=$('#tdisp');if(disp)disp.textContent=fmtDuration(t.left);const mini=$('#mini-timer');if(mini)mini.textContent=t.run?`⏱ ${fmtDuration(t.left)}${t.ph==='f'?' Focus':' Break'}`:'';document.title=t.run?`${fmtDuration(t.left)} · Padhle!`:'Padhle! — CA Final Study Planner';}
setInterval(timerTick,500);

function handleTimerFinish(auto){const t=S.tm;if(t.ph==='f'){const mins=auto?t.f:Math.round(((t.f*60)-t.left)/60);if(mins>0){S.sess.push({d:today(),sub:t.sub,task:t.task||'Focus Session',min:mins});toast(`${mins} minutes logged! 🎉`);}}if(auto)playChime();t.ph=t.ph==='f'?'b':'f';t.left=(t.ph==='f'?t.f:t.b)*60;t.run=false;saveActiveUserData();renderApp();}
function timerStart(){const t=S.tm;if($('#tsub'))t.sub=$('#tsub').value;if($('#ttask'))t.task=$('#ttask').value;t.end=Date.now()+t.left*1000;t.run=true;saveActiveUserData();renderApp();}
function timerPause(){const t=S.tm;t.left=Math.max(0,Math.round((t.end-Date.now())/1000));t.run=false;saveActiveUserData();renderApp();}
function timerReset(){const t=S.tm;t.run=false;t.ph='f';t.left=t.f*60;saveActiveUserData();renderApp();}
function timerPreset(f,b){const t=S.tm;if(t.run)return toast('Pause or reset timer first');t.f=f;t.b=b;t.ph='f';t.left=f*60;saveActiveUserData();renderApp();}
function timerCustom(){const f=+$('#cf').value;const b=+$('#cb').value;if(!(f>=1&&f<=180&&b>=1&&b<=60))return toast('Focus: 1-180m, Break: 1-60m');timerPreset(f,b);}
function completeTimeblockTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.done=1;t.on=today();S.sess.push({d:today(),sub:t.sub,task:`Completed: ${t.t}`,min:45});saveActiveUserData();renderApp();toast('✓ Done & 45 min logged!');}
function openIncompleteModal(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  modal(`<div class="row"><h3 style="margin:0;color:var(--bad);">⚠️ Record Bottleneck</h3><span class="sp"></span><button class="btn sm" onclick="closeM()">✕</button></div><p class="mut" style="font-size:12.5px;">Why was <b>"${esc(t.t)}"</b> not completed?</p><div class="form-group" style="margin-top:14px;"><label style="font-weight:700;font-size:12px;color:var(--tx-sec);">Primary Reason</label><select id="bot_reason" style="width:100%;"><option value="Concept took longer than expected">Concept took longer than expected</option><option value="Distraction / Social Media">Distraction / Social Media</option><option value="Emergency / Articleship">Emergency / Articleship</option><option value="Underestimated chapter length">Underestimated chapter length</option><option value="Lack of clarity / Concept doubts">Lack of clarity / Concept doubts</option><option value="Fatigue / Burnout">Fatigue / Burnout</option><option value="Other">Other</option></select></div><div class="form-group"><label style="font-weight:700;font-size:12px;color:var(--tx-sec);">Notes</label><textarea id="bot_notes" placeholder="Additional detail..."></textarea></div><div class="row" style="justify-content:flex-end;margin-top:16px;"><button class="btn" onclick="closeM()">Cancel</button><button class="btn pri" onclick="saveIncompleteReason(${t.id})">Save</button></div>`);
}
function saveIncompleteReason(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;const r=$('#bot_reason').value;const n=$('#bot_notes').value.trim();S.bottlenecks.push({id:Date.now(),taskId:t.id,taskTitle:t.t,sub:t.sub,reason:r==='Other'&&n?n:n?`${r} (${n})`:r,date:today(),time:new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})});saveActiveUserData();closeM();toast('Bottleneck logged');}

views.timer=()=>{
  const t=S.tm;const activeSubs=getActiveSubjects();const totalMins=S.sess.reduce((a,x)=>a+x.min,0);
  const todayTasks=S.tasks.filter(x=>x.date===today());
  return`
    <h2 class="gradient-text">Focus Timer & Time-Block Execution</h2>
    <div class="g g2">
      <div class="card" style="text-align:center;">
        <div class="row" style="justify-content:center;margin-bottom:14px;">${[[25,5,'Pomodoro'],[50,10,'Deep Work'],[90,15,'Marathon']].map(([f,b,lbl])=>`<button class="btn ${t.f===f&&t.b===b?'pri':''}" onclick="timerPreset(${f},${b})" title="${lbl}">${f}/${b}m</button>`).join('')}</div>
        <div class="row" style="justify-content:center;font-size:12px;"><span class="mut">Custom:</span><input type="number" id="cf" value="${t.f}" style="width:55px;" min="1" max="180">/<input type="number" id="cb" value="${t.b}" style="width:55px;" min="1" max="60"><button class="btn sm" onclick="timerCustom()">Set</button></div>
        <div style="margin:24px 0 14px;"><span class="tag" style="background:${t.ph==='f'?'var(--pri)':'var(--ok)'};font-size:13px;padding:5px 16px;animation:${t.run?'pulseGlow 2s ease infinite':'none'};">${t.ph==='f'?'🎯 Focus Block':'☕ Break'}</span><div class="timer-display" id="tdisp">${fmtDuration(t.left)}</div></div>
        <div class="row" style="justify-content:center;margin-bottom:12px;"><select id="tsub" style="font-weight:600;">${activeSubs.map(k=>`<option value="${k}" ${t.sub===k?'selected':''}>${k}</option>`).join('')}</select><input id="ttask" placeholder="What are you mastering?" value="${esc(t.task)}" style="width:200px;"></div>
        <div class="row" style="justify-content:center;gap:10px;">${t.run?`<button class="btn pri" onclick="timerPause()" style="padding:12px 28px;font-weight:800;">⏸ Pause</button>`:`<button class="btn pri" onclick="timerStart()" style="padding:12px 28px;font-weight:800;">▶ ${t.left<(t.ph==='f'?t.f:t.b)*60?'Resume':'Start'}</button>`}<button class="btn" onclick="timerReset()">↺ Reset</button><button class="btn" onclick="handleTimerFinish(false)">✓ Log</button></div>
        <small class="mut" style="display:block;margin-top:10px;">Timer runs accurately in the background even across tabs.</small>
      </div>
      <div class="card"><div class="row"><h3 style="margin:0;" class="gradient-text">Today's Scheduled Tasks</h3><span class="sp"></span><button class="btn sm" onclick="go('plan')">+ Plan</button></div><small class="mut" style="display:block;margin-bottom:12px;">Complete or report bottlenecks per time-block.</small>${todayTasks.length?todayTasks.map(task=>`<div class="timeblock-item ${task.done?'done':''}"><div style="flex:1;">${tagS(task.sub)} <b>${esc(task.t)}</b><br><small class="mut">${task.startTime?`${fmtTime(task.startTime)}-${fmtTime(task.endTime)}`:'Flexible'}</small></div>${!task.done?`<div style="display:flex;gap:6px;"><button class="action-btn-circle btn-tick" title="Complete" onclick="completeTimeblockTask(${task.id})">✓</button><button class="action-btn-circle btn-cross" title="Not Completed" onclick="openIncompleteModal(${task.id})">✗</button></div>`:`<span class="badge" style="background:var(--ok-soft);color:var(--ok);">Done ✓</span>`}</div>`).join(''):'<div style="text-align:center;padding:30px;" class="mut">No tasks today.</div>'}</div>
    </div>
    <div class="card"><div class="row"><h3 style="margin:0;" class="gradient-text">Productivity Bottlenecks Log</h3><span class="sp"></span><small class="mut">${S.bottlenecks.length} recorded</small></div>${S.bottlenecks.length?[...S.bottlenecks].reverse().slice(0,8).map(b=>`<div class="bottleneck-row"><div style="display:flex;justify-content:space-between;"><b>${tagS(b.sub)} ${esc(b.taskTitle)}</b><small class="mut">${b.date} ${b.time}</small></div><div style="color:var(--bad);font-weight:600;margin-top:2px;">${esc(b.reason)}</div></div>`).join(''):'<div class="mut" style="font-size:12.5px;">No bottlenecks yet. Stay focused! 💪</div>'}</div>
    <div class="card"><h3 class="gradient-text">Recent Sessions (${(totalMins/60).toFixed(1)}h Total)</h3>${S.sess.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;">${[...S.sess].reverse().slice(0,8).map(s=>`<div style="background:var(--card-alt);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:12px;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--pri-border)'" onmouseout="this.style.borderColor='var(--bd)'">${tagS(s.sub)} <b>${s.min}m</b> · <span class="mut">${s.d}</span><div style="color:var(--tx-sec);margin-top:2px;">${esc(s.task)}</div></div>`).join('')}</div>`:'<span class="mut">Complete a session to log hours.</span>'}</div>`;
};

views.data=()=>`
  <h2 class="gradient-text">Backup, Reports & Data</h2>
  <div class="card card-glow"><h3>Multi-User Profile Backup</h3><p class="mut">All data persists in browser localStorage. Export regularly.</p><div class="row"><button class="btn pri" onclick="exportUserJSON()">📥 Export JSON</button><button class="btn" onclick="exportExcelReport()">📊 Export Excel</button><button class="btn" onclick="exportCSVReport()">📄 Export CSV</button><button class="btn" onclick="window.print()">🖨️ Print/PDF</button></div><div style="margin-top:16px;"><label style="font-weight:700;font-size:12px;" class="mut">Import Profile JSON:</label><textarea id="import_json_box" placeholder="Paste backup JSON here..." style="min-height:100px;margin-top:4px;"></textarea><div class="row" style="margin-top:8px;"><button class="btn" onclick="restoreFromTextarea()">Restore from Text</button><input type="file" accept=".json" onchange="handleFileRestore(this)"></div></div></div>
  <div class="card"><h3 style="color:var(--bad);">⚠️ Danger Zone</h3><p class="mut">Destructive actions cannot be undone.</p><div class="row"><button class="btn d" onclick="cfm('Reset ALL progress for ${esc(currentUser.name)}?',resetCurrentUserData)">Reset User Data</button><button class="btn d" onclick="cfm('PERMANENTLY DELETE account ${esc(currentUser.id)}?',deleteCurrentUserAccount)">Delete Account</button></div></div>`;

function exportUserJSON(){const payload={version:'padhle.v2',user:currentUser,data:S,exportedAt:new Date().toISOString()};downloadFile(`${currentUser.id}_padhle_backup.json`,JSON.stringify(payload,null,2),'application/json');toast('JSON backup exported');}
function exportExcelReport(){if(typeof XLSX==='undefined')return toast('Excel library loading...');const chData=[['Paper','Subject','Module','Chapter','ABC','Completion%','Lecture','Read','R1','R2','R3','Mock','LastRevised','NextTarget','WeakPoints','ImportantQ']];CH.forEach(c=>{const p=gp(c.id);chData.push([PAPERS[c.sub].no,c.sub,c.mod,c.name,p.abc,cs(c)+'%',p.lec?'Y':'N',p.read?'Y':'N',p.r1?'Y':'N',p.r2?'Y':'N',p.r3?'Y':'N',p.mock?'Y':'N',p.last||'',p.next||'',p.weak||'',p.imp||'']);});const sessData=[['Date','Subject','Task','Minutes','Hours']];S.sess.forEach(x=>{sessData.push([x.d,x.sub,x.task,x.min,+(x.min/60).toFixed(2)]);});const botData=[['Date','Time','Subject','Task','Reason']];S.bottlenecks.forEach(b=>{botData.push([b.date,b.time,b.sub,b.taskTitle,b.reason]);});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(chData),'Chapters');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sessData),'Sessions');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(botData),'Bottlenecks');XLSX.writeFile(wb,`Padhle_${currentUser.id}.xlsx`);toast('Excel report downloaded');}
function exportCSVReport(){const rows=[['Subject','Chapter','ABC','%','Lec','Read','R1','R2','R3','Mock','Last','Next']];CH.forEach(c=>{const p=gp(c.id);rows.push([c.sub,c.name,p.abc,cs(c)+'%',p.lec,p.read,p.r1,p.r2,p.r3,p.mock,p.last,p.next]);});downloadFile(`Padhle_${currentUser.id}.csv`,rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');}
function downloadFile(name,content,mime){try{const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){}}
function restoreFromTextarea(){const val=$('#import_json_box').value.trim();if(!val)return toast('Paste backup JSON');try{processRestoreData(JSON.parse(val));}catch(e){toast('Invalid JSON');}}
function handleFileRestore(input){const f=input.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{processRestoreData(JSON.parse(reader.result));}catch(e){toast('Failed to parse file');}};reader.readAsText(f);}
function processRestoreData(obj){cfm('Replace current data with this backup?',()=>{if(obj.data&&obj.data.p)S=obj.data;else if(obj.p)S=obj;else return toast('Unrecognized backup');saveActiveUserData();toast('Restored! ✓');renderApp();});}
function resetCurrentUserData(){S=defaultUserData(currentUser.attempt,currentUser.group);saveActiveUserData();toast('Progress reset');renderApp();}
function deleteCurrentUserAccount(){const users=getUsersRegistry().filter(u=>u.id!==currentUser.id);saveUsersRegistry(users);localStorage.removeItem('padhle_data_'+currentUser.id);handleLogout();toast('Account deleted');}

// === MAIN RENDERER ===
function renderApp(){
  if(!currentUser||!S){renderAuthPortal();return;}
  charts.forEach(c=>c.destroy());charts=[];pend=[];
  $('#app-container').innerHTML=`
    <div class="app-root">
      <aside>
        <div class="brand-box"><div><a class="brand-title" href="javascript:void(0)" onclick="go('dash')">Padhle!</a><div class="logo-tagline hide-col">Bullying you into CA 🎓</div></div><button class="toggle-side-btn" onclick="document.body.classList.toggle('sidebar-col')" title="Toggle">☰</button></div>
        <nav class="nav-links">${NAV.map(item=>`<button class="nav-btn ${V===item[0]?'active':''}" onclick="go('${item[0]}')"><span class="icon">${item[1]}</span><span class="hide-col">${item[2]}</span></button>`).join('')}</nav>
        <div class="sidebar-footer hide-col"><div id="mini-timer" style="font-weight:700;color:var(--pri);margin-bottom:4px;"></div><div>ICAI May 2027 Scheme</div><small class="mut">Multi-user · PWA</small></div>
      </aside>
      <div class="content-wrap">
        <header class="topbar">
          <div class="topbar-left"><span class="page-title">${NAV.find(x=>x[0]===V)?.[2]||'Padhle'}</span></div>
          <div class="utility-bar">
            <button class="pill-btn" onclick="toggleTimeFormat()" title="Toggle 12H/24H"><span style="font-weight:700;">🕒 ${S.timeFormat.toUpperCase()}</span></button>
            <button class="pill-btn" onclick="toggleTheme()"><span id="theme-icon">${S.theme==='dark'?'☀️':'🌙'}</span><span id="theme-label" class="hide-col">${S.theme==='dark'?'Light':'Dark'}</span></button>
            <div class="user-pill" onclick="openProfileSettings()"><div class="user-avatar">${esc(currentUser.name[0]||'C')}</div><span class="user-name-text">${esc(currentUser.name)}</span><span class="badge" style="background:var(--pri);color:#fff;font-size:10px;">${esc(S.group)}</span></div>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
          </div>
        </header>
        <main id="main">${views[V]?views[V](subActive):views.dash()}</main>
      </div>
    </div>`;
  applyTheme();pend.forEach(fn=>fn());
}

function initApplication(){
  const isActive=loadActiveUserSession();
  if(isActive){renderApp();schedulePendingTaskReminder();}
  else{const users=getUsersRegistry();if(!users.length){saveUsersRegistry([{id:'ca_aspirant',name:'CA Aspirant',attempt:'May 2027',group:'Both Groups',password:'padhle2027',createdAt:new Date().toISOString()}]);localStorage.setItem('padhle_data_ca_aspirant',JSON.stringify(defaultUserData('May 2027','Both Groups')));}renderAuthPortal('login');}
}

// PWA Service Worker Registration
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}

window.addEventListener('DOMContentLoaded',initApplication);
</script>
</body>
</html>
